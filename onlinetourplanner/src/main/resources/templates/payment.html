<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Gateway - OnlineTourPlanner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-secondary p-4 d-flex align-items-center vh-100">
<div class="container" style="max-width: 500px;">
    <div class="card shadow-lg border-0 p-4">
        <h4 class="text-center mb-3">🔒 Secure Checkout</h4>
        <div class="alert alert-info">
            Paying for: <strong th:text="${trip.title}"></strong><br>
            Total Amount: <strong class="text-success">₹<span th:text="${trip.price}"></span></strong>
        </div>

        <form th:action="@{/confirm-booking}" method="post">
            <input type="hidden" name="tripId" th:value="${trip.id}">
            <input type="hidden" name="name" th:value="${name}">
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="phone" th:value="${phone}">

            <div class="mb-3">
                <label class="form-label">Cardholder Name</label>
                <input type="text" class="form-control" th:value="${name}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-control" placeholder="4532 •••• •••• 8921" required>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Expiry Date</label>
                    <input type="text" class="form-control" placeholder="12/28" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">CVV</label>
                    <input type="password" class="form-control" placeholder="•••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 mt-2">Pay & Confirm Booking</button>
        </form>
    </div>
</div>
</body>
</html>
