<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Browse Packages - OnlineTourPlanner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4 mb-4">
    <span class="navbar-brand fw-bold">✈️ OnlineTourPlanner</span>
    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container">
    <h3 class="mb-4">Popular Holiday Packages</h3>
    <div class="row">
        <div th:each="pkg : ${packages}" class="col-md-6 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <img th:src="${pkg.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="fw-bold" th:text="${pkg.title}"></h5>
                        <h4 class="text-success fw-bold">₹<span th:text="${pkg.price}"></span></h4>
                    </div>
                    <p class="text-muted mb-2" th:text="${pkg.days} + ' Days / ' + (${pkg.days}-1) + ' Nights'"></p>
                    <div class="mb-3">
                        <span class="badge bg-light text-primary border" th:text="${pkg.flightDetails}"></span>
                        <span class="badge bg-light text-primary border" th:text="${pkg.hotelDetails}"></span>
                    </div>
                    <a th:href="@{'/package/' + ${pkg.id}}" class="btn btn-primary w-100">View Details & Book</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
