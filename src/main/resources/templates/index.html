<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Online Tour Planner - MakeMyTrip Style</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .package-card { transition: transform 0.2s; border-radius: 12px; }
        .package-card:hover { transform: translateY(-4px); }
        .badge-inc { background-color: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-4 mb-4 shadow-sm">
    <span class="navbar-brand mb-0 h1">✈️ OnlineTourPlanner</span>
</nav>

<div class="container">
    <h3 class="mb-4">Trending Tour Packages</h3>

    <div class="row">
        <!-- Package Cards List -->
        <div class="col-md-7">
            <div th:each="pkg : ${packages}" class="card package-card mb-4 shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="card-title fw-bold text-dark" th:text="${pkg.packageName}"></h5>
                            <span class="badge bg-secondary mb-2" th:text="${pkg.durationDays} + ' Days / ' + (${pkg.durationDays} - 1) + ' Nights'"></span>
                        </div>
                        <h4 class="text-success fw-bold">₹<span th:text="${pkg.price}"></span></h4>
                    </div>

                    <!-- Package Inclusions -->
                    <div class="my-3">
                        <span class="badge badge-inc p-2 me-2 mb-1" th:text="${pkg.flightDetails}"></span>
                        <span class="badge badge-inc p-2 me-2 mb-1" th:text="${pkg.transferDetails}"></span>
                        <span class="badge badge-inc p-2 mb-1" th:text="${pkg.hotelDetails}"></span>
                    </div>

                    <a th:href="@{'/package/' + ${pkg.id}}" class="btn btn-outline-primary w-100">View Full Itinerary & Book</a>
                </div>
            </div>
        </div>

        <!-- Package Details Panel -->
        <div class="col-md-5">
            <div th:if="${selectedPackage}" class="card shadow-sm p-4 border-primary">
                <h4 class="text-primary" th:text="${selectedPackage.packageName}"></h4>
                <p class="text-muted" th:text="${selectedPackage.durationDays} + ' Days Package'"></p>
                <hr>

                <h5>What's Included:</h5>
                <ul class="list-unstyled">
                    <li class="mb-2" th:text="${selectedPackage.flightDetails}"></li>
                    <li class="mb-2" th:text="${selectedPackage.transferDetails}"></li>
                    <li class="mb-2" th:text="${selectedPackage.hotelDetails}"></li>
                </ul>

                <h5 class="mt-3">Day-by-Day Schedule:</h5>
                <p class="bg-white p-3 border rounded text-secondary" th:text="${selectedPackage.itineraryDetails}"></p>

                <button class="btn btn-success btn-lg w-100 mt-2" onclick="alert('Booking Confirmed! Transfer and Hotel voucher sent.')">Book Package Now</button>
            </div>

            <div th:unless="${selectedPackage}" class="alert alert-info text-center p-4">
                👈 Select any package on the left to view the full Flight + Bus + Hotel itinerary details!
            </div>
        </div>
    </div>
</div>

</body>
</html>
