<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up - WanderLuxe Tours</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #051367 0%, #1D5D9B 50%, #75C2F6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
        }
        .header-banner {
            background: linear-gradient(45deg, #00d2d3, #01a3a4);
            padding: 25px;
            color: white;
            text-align: center;
        }
        .required-star { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div class="card-box">
    <div class="header-banner">
        <h3 class="fw-bold m-0">Create Account</h3>
        <p class="small m-0 text-light opacity-90">Join WanderLuxe Tours Today</p>
    </div>
    <div class="p-4">
        <form th:action="@{/signup}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Full Name <span class="required-star">*</span></label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Email Address <span class="required-star">*</span></label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Phone Number <span class="required-star">*</span></label>
                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+91 9876543210" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Username <span class="required-star">*</span></label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold">Password <span class="required-star">*</span></label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-info text-white w-100 fw-bold py-2 mb-3">Sign Up Now</button>
            <div class="text-center">
                <!-- Redirects directly to landing page with auto-open login popup trigger -->
                <a th:href="@{/?login=true}" class="text-decoration-none small text-muted">Already have an account? Log In</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
